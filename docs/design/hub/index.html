<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Touchline Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: broadcast shell. Rundown sidebar | stage. One dominant Next-match graphic, supporting panels of different sizes and materials.
   Game tokens are SPEC §19.2 verbatim; --newsprint/--news-ink come from ART-DIRECTION §6.3; --ref-* style only the reference bar. */
:root{
  --bg:#07090D; --surface:#0E1218; --surface-2:#151A22; --surface-3:#1C222C; --border:#2A313D;
  --desk:#100E0C; --desk-2:#191613; --desk-border:#2E2924;
  --paper:#EFEBE3; --paper-2:#E4DED2; --paper-ink:#1B1A17; --paper-dim:#5E574E; --paper-rule:#CFC6B6;
  --board:#E9ECEA; --board-ink:#1E2A38; --marker-red:#C42B2B; --marker-blue:#1F4FBF; --marker-green:#1E7B3C;
  --text:#F2F4F7; --text-dim:#A3ACBA; --text-faint:#7D8696;
  --accent:#FF5B35; --accent-ink:#1A0600; --accent-text:#FF6E4D;
  --band-1:#FF5B35; --band-2:#F2F4F7; --club-primary:#FF5B35; --club-secondary:#F2F4F7;
  --gold:#FFC83D; --info:#3DA5FF; --win:#18C77A; --draw:#A3ACBA; --loss:#FF4D5E; --warning:#FFB020; --danger:#FF4D5E;
  --radius-s:2px; --radius-m:4px; --radius-l:6px; --cut:10px;
  --shadow-1:0 1px 2px rgb(0 0 0 / .4);
  --shadow-paper:0 1px 0 rgb(0 0 0 / .25), 0 10px 24px rgb(0 0 0 / .5);
  --font-head:'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif; --font-body:'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --dur-micro:120ms; --dur-fast:180ms; --dur-med:260ms; --dur-wipe:440ms; --dur-count:650ms; --dur-reorder:700ms;
  --ease-snap:cubic-bezier(.2,.9,.1,1); --ease-out:cubic-bezier(.2,.8,.2,1); --ease-in:cubic-bezier(.5,0,.8,.2);
  --newsprint:#EDE8DC; --news-ink:#141414;
  --ref-bg:#040608; --ref-text:#8E97A6; --ref-border:#1F252E;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ref-bg);color:var(--text);font:400 14px/1.45 var(--font-body);display:flex;flex-direction:column;gap:10px;
  padding-block:10px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
.lucide{width:18px;height:18px;stroke-width:1.75;flex:none}

/* ---------- reference bar (not part of the game) ---------- */
.ref{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;color:var(--ref-text);font-size:12px}
.ref-t{font:600 13px/1 var(--font-head);letter-spacing:.1em;text-transform:uppercase;color:var(--text)}
.ref-g{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sw-row{display:flex;gap:3px;flex-wrap:wrap}
.sw{width:34px;height:22px;border-radius:2px;background:var(--c);color:var(--ci);font:700 11px/22px var(--font-head);letter-spacing:.04em;text-align:center;opacity:.5;transition:opacity var(--dur-fast)}
.sw:hover,.sw[aria-pressed="true"]{opacity:1}
.sw[aria-pressed="true"]{box-shadow:0 0 0 1px var(--ref-bg),0 0 0 2px var(--c)}
.ref-btn{border:1px solid var(--ref-border);border-radius:2px;padding:4px 10px;color:var(--text-dim)}
.ref-btn:hover,.ref-btn[aria-pressed="true"]{color:var(--text);border-color:var(--text-faint)}
.ref-hint{margin-left:auto}
.ref-hint kbd{font:500 11px/1 var(--font-body);border:1px solid var(--ref-border);border-radius:2px;padding:2px 5px;color:var(--text-dim)}

/* ---------- shell ---------- */
.app{flex:1;min-height:620px;display:grid;grid-template-columns:232px minmax(0,1fr);grid-template-rows:64px minmax(0,1fr) 36px;
  grid-template-areas:"top top" "nav stage" "nav tick";background:var(--bg);border:1px solid var(--border);position:relative;overflow:hidden;isolation:isolate}
.app.office{grid-template-areas:"top top" "nav stage" "nav stage"}
.app.office .ticker{display:none}

.top{grid-area:top;display:flex;align-items:center;gap:16px;padding:0 12px 0 16px;background:var(--surface);border-bottom:1px solid var(--border);position:relative;z-index:3;min-width:0}
.club{display:flex;align-items:center;gap:10px;width:216px;min-width:0;flex:none}
.club-name{font:700 20px/1 var(--font-head);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{flex:1;display:flex;justify-content:center;align-items:center;gap:12px;font:600 14px/1 var(--font-head);letter-spacing:.06em;text-transform:uppercase;color:var(--text-dim);white-space:nowrap;min-width:0}
.status b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.status .sep{width:4px;height:4px;background:var(--text-faint);transform:rotate(45deg)}
.tools{display:flex;align-items:center;gap:4px;margin-left:auto;flex:none}
.bal{font:600 20px/1 var(--font-head);font-variant-numeric:tabular-nums;margin-right:8px;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.bal small{font:600 10px/1 var(--font-head);letter-spacing:.1em;color:var(--text-faint)}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:var(--radius-m);color:var(--text-dim);position:relative}
.icon-btn:hover{background:var(--surface-3);color:var(--text)}
.badge{position:absolute;top:2px;right:0;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font:700 11px/16px var(--font-head);text-align:center;font-variant-numeric:tabular-nums}

.btn-go{position:relative;isolation:isolate;height:44px;padding:0 12px 0 18px;margin-left:8px;display:inline-flex;align-items:center;gap:12px;color:var(--accent-ink);
  font:700 19px/1 var(--font-head);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.btn-go::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--accent);
  clip-path:polygon(0 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%)}
.btn-go:hover::before{background:color-mix(in srgb,var(--accent) 86%,#fff)}
.btn-go:active{transform:translateY(2px)}
.lbl-wrap{position:relative;display:block;height:20px;overflow:hidden}
.lbl{display:block;line-height:20px;white-space:nowrap}
.key{font:600 11px/1 var(--font-body);letter-spacing:0;text-transform:none;padding:3px 5px;border:1px solid color-mix(in srgb,var(--accent-ink) 40%,transparent);border-radius:2px}

/* the rundown */
.nav{grid-area:nav;position:relative;background:var(--surface);border-right:1px solid var(--border);padding:16px 8px;display:flex;flex-direction:column;gap:18px;overflow:hidden;z-index:2}
.nav::before{content:"";position:absolute;inset:0;background:var(--desk);opacity:0;transition:opacity var(--dur-med) var(--ease-out)}
.app.office .nav::before{opacity:1}
.grp{position:relative;z-index:1;display:flex;flex-direction:column}
.grp-h{font:600 11px/1 var(--font-head);letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint);padding:0 12px 8px}
.it{position:relative;z-index:1;display:flex;align-items:center;gap:12px;width:100%;height:36px;padding:0 12px;border-radius:var(--radius-s);color:var(--text-dim);font:500 14px/1 var(--font-body)}
.it .tx{transition:transform var(--dur-fast) var(--ease-out)}
.it .k{margin-left:auto;font:500 11px/1 var(--font-body);color:var(--text-faint);opacity:0;transition:opacity var(--dur-fast)}
.it:hover{color:var(--text);background:color-mix(in srgb,var(--surface-3) 70%,transparent)}
.it:hover .tx{transform:translateX(2px)}
.it:hover .k,.it:focus-visible .k{opacity:1}
.it.is-active{height:64px;color:transparent;background:none}
.it.is-active .k,.it.is-active .lucide{opacity:0}
.block{position:absolute;left:8px;right:8px;top:0;height:64px;z-index:0;pointer-events:none;background:var(--accent);color:var(--accent-ink);
  padding:0 12px;display:flex;flex-direction:column;justify-content:center;gap:5px;clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%)}
.block .bn{display:flex;align-items:center;gap:10px;font:700 22px/1 var(--font-head);text-transform:uppercase;letter-spacing:.02em}
.block .bc{font:500 12px/1.2 var(--font-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.8;padding-left:28px}
.flag{position:absolute;left:72px;top:0;z-index:40;pointer-events:none;opacity:0;background:var(--accent);color:var(--accent-ink);
  font:700 16px/1 var(--font-head);letter-spacing:.04em;text-transform:uppercase;padding:10px 18px 10px 12px;clip-path:polygon(0 0,100% 0,calc(100% - 10px) 100%,0 100%)}

/* stage */
.stage{grid-area:stage;position:relative;overflow:hidden;min-width:0;min-height:0}
.screen{position:absolute;inset:0;overflow:auto;padding:24px;container-type:inline-size}
.screen.is-office{padding:0;background:var(--desk)}
.wipe{position:absolute;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.wipe i{position:absolute;top:-4px;bottom:-4px;left:0;transform:translateX(-300vw)}
.wipe .b1{background:var(--band-1);z-index:1}
.wipe .b2{background:var(--band-2)}
.slate{position:absolute;left:24px;top:20px;z-index:61;opacity:0;pointer-events:none;display:flex;align-items:center;gap:8px;
  font:600 14px/1 var(--font-head);letter-spacing:.14em;text-transform:uppercase;color:var(--accent-text)}
.slate::before{content:"";width:9px;height:9px;background:var(--accent);transform:skewX(-12deg)}

/* ---------- on-air panels ---------- */
.hub{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;max-width:1600px}
.p-next{grid-column:1/-1}
.p-table{grid-column:1/5}
.p-news{grid-column:5/10}
.p-inbox{grid-column:10/13}
.p-squad{grid-column:1/4}
.p-board{grid-column:4/8}
.p-tip{grid-column:8/13}
@container (max-width:900px){
  .hub{grid-template-columns:repeat(6,minmax(0,1fr))}
  .p-table{grid-column:1/4}.p-news{grid-column:4/7}
  .p-inbox{grid-column:1/4}.p-squad{grid-column:4/7}
  .p-board{grid-column:1/4}.p-tip{grid-column:4/7}
}
@container (max-width:560px){
  .hub{grid-template-columns:minmax(0,1fr)}
  .hub>*{grid-column:1/-1 !important}
}
.panel{position:relative;min-width:0;background:var(--surface);border-radius:var(--radius-s);padding:16px;display:flex;flex-direction:column;gap:12px}
.panel::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--band-1) 0 67%,var(--band-2) 67% 100%)}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-top:2px;font:600 14px/1 var(--font-head);letter-spacing:.06em;text-transform:uppercase;color:var(--text)}
.ph .meta{font-size:12px;color:var(--text-faint);letter-spacing:.08em}

/* next match: the dominant graphic */
.p-next{padding:0;gap:0;overflow:hidden}
.p-next::before{display:none}
.nx-tab{display:flex;align-items:stretch;height:36px;border-bottom:1px solid var(--border)}
.nx-tab .t{background:var(--accent);color:var(--accent-ink);font:700 15px/36px var(--font-head);letter-spacing:.1em;text-transform:uppercase;padding:0 30px 0 16px;
  clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%)}
.nx-tab .m{font:600 13px/36px var(--font-head);letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);padding-left:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nx-body{position:relative;overflow:hidden}
.vs{display:grid;grid-template-columns:150px minmax(0,1fr) auto minmax(0,1fr) 150px;align-items:center;gap:20px;padding:30px 40px;min-height:258px;position:relative}
.cap{display:block;position:relative;z-index:1;width:150px;height:244px;align-self:end;margin-bottom:-30px;pointer-events:none}
@container (max-width:780px){ .vs{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);min-height:0;padding:28px 44px 26px} .cap{display:none} }
.vs::before,.vs::after{content:"";position:absolute;top:-10px;bottom:-10px;width:22px;transform:skewX(-12deg)}
.vs::before{left:-6px;background:linear-gradient(90deg,var(--h1) 0 62%,var(--h2) 62% 100%)}
.vs::after{right:-6px;background:linear-gradient(90deg,var(--a2) 0 38%,var(--a1) 38% 100%)}
.side{display:flex;flex-direction:column;gap:8px;min-width:0}
.side.away{align-items:flex-end;text-align:right}
.side .nm{font:700 clamp(30px,5.2cqi,48px)/.92 var(--font-head);text-transform:uppercase;letter-spacing:.02em;text-wrap:balance;margin:2px 0 0}
.side .sub{font:500 13px/1.2 var(--font-body);color:var(--text-dim)}
.side .sub b{color:var(--text);font-weight:600}
.side .scorers{font:400 12px/1.5 var(--font-body);color:var(--text-dim);min-height:18px}
.mid{display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 8px;text-align:center}
.mid .ko{font:600 60px/1 var(--font-head);font-variant-numeric:tabular-nums}
.mid .score{font:600 76px/1 var(--font-head);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.mid .day{font:600 14px/1 var(--font-head);letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim)}
.mid .venue{font:500 13px/1.3 var(--font-body)}
.mid .wx{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-dim)}
.mid .wx .lucide{width:16px;height:16px}
.form{display:flex;gap:3px}
.fd{width:17px;height:17px;border-radius:2px;display:grid;place-items:center;font:700 11px/1 var(--font-head);color:var(--bg)}
.fd.W{background:var(--win)}.fd.D{background:var(--draw)}.fd.L{background:var(--loss)}
.nx-foot{display:flex;align-items:center;gap:14px;padding:12px 16px;border-top:1px solid var(--border);background:var(--surface-2)}
.portrait{width:44px;height:44px;flex:none;display:block;background:var(--paper)}
.quote{flex:1;min-width:0;font:400 14px/1.45 var(--font-body);max-width:68ch}
.quote .who{display:block;font:600 12px/1 var(--font-head);letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);margin-bottom:4px}
@container (max-width:620px){
  .vs{grid-template-columns:minmax(0,1fr);padding:22px 28px}
  .side.away{align-items:flex-start;text-align:left}
  .mid{flex-direction:row;flex-wrap:wrap;align-items:baseline;gap:6px 12px;padding:0;text-align:left;order:3}
  .mid .ko{font-size:36px}.mid .score{font-size:44px}
  .nx-foot{flex-wrap:wrap}
}

.btn2{height:36px;padding:0 14px;display:inline-flex;align-items:center;gap:8px;background:var(--surface-3);border-radius:var(--radius-m);font:500 14px/1 var(--font-body);white-space:nowrap;color:var(--text)}
.btn2:hover{background:var(--border)}
.btn2:active{transform:translateY(2px)}
.btn2 .lucide{width:16px;height:16px}
.btn-ghost{height:32px;padding:0 10px;display:inline-flex;align-items:center;gap:6px;border-radius:var(--radius-m);color:var(--text-dim);font:500 13px/1 var(--font-body)}
.btn-ghost:hover{color:var(--text);background:var(--surface-3)}
.btn-ghost .lucide{width:16px;height:16px}

/* standings */
.tbl{display:flex;flex-direction:column;font-size:14px;margin:0 -8px}
.tr{position:relative;display:grid;grid-template-columns:20px 10px minmax(0,1fr) 22px 34px 30px 12px;align-items:center;gap:8px;height:34px;padding:0 8px;border-top:1px solid var(--border);font-variant-numeric:tabular-nums}
.tr.head{height:22px;border-top:0;font:600 11px/1 var(--font-head);letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint)}
.tr .n{text-align:right}
.tr .cn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .pts{font-weight:600}
.tr.you{background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.tr.you::before{content:"";position:absolute;left:0;top:-1px;bottom:0;width:3px;background:var(--accent)}
.tr.you .cn{font-weight:600}
.kit{width:10px;height:18px;transform:skewX(-12deg);background:linear-gradient(90deg,var(--k1) 0 55%,var(--k2) 55% 100%)}
.mv{width:12px;height:12px;display:grid;place-items:center}
.mv::before{content:"";width:6px;height:2px;background:var(--text-faint)}
.mv.up::before{width:0;height:0;background:none;border:5px solid transparent;border-bottom:6px solid var(--win);border-top:0}
.mv.down::before{width:0;height:0;background:none;border:5px solid transparent;border-top:6px solid var(--loss);border-bottom:0}
.flash{position:absolute;inset:0;opacity:0;pointer-events:none}
.p-table .foot{margin-top:auto;display:flex;justify-content:flex-end}

/* newspaper */
.p-news{background:var(--newsprint);color:var(--news-ink);padding:14px 16px 16px;gap:10px}
.p-news::before{display:none}
.mast{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-bottom:6px;border-bottom:3px double var(--news-ink);font:700 19px/1 var(--font-head);letter-spacing:.05em;text-transform:uppercase}
.mast small{font:500 11px/1 var(--font-body);letter-spacing:0;text-transform:none;white-space:nowrap}
.photo{display:block;width:100%;aspect-ratio:16/9;max-width:100%;background:var(--newsprint)}
.hl{margin:0;font:700 28px/1 var(--font-head);text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.stand{margin:0;font:400 13px/1.5 var(--font-body)}
.by{font:600 11px/1 var(--font-head);letter-spacing:.1em;text-transform:uppercase}

/* inbox */
.mail{display:flex;flex-direction:column;margin:0 -8px}
.ml{display:grid;grid-template-columns:6px minmax(0,1fr) auto;gap:3px 10px;align-items:center;width:100%;padding:9px 8px;border-top:1px solid var(--border);border-radius:0}
.ml:first-child{border-top:0}
.ml:hover{background:var(--surface-2)}
.ml .dot{width:6px;height:6px;border-radius:50%;background:var(--accent-text);grid-row:1/3}
.ml.read .dot{background:transparent}
.ml .from{font:500 12px/1.2 var(--font-body);color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ml .when{font-size:12px;color:var(--text-faint);font-variant-numeric:tabular-nums}
.ml .subj{grid-column:2/4;font:500 14px/1.3 var(--font-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ml.read .subj{color:var(--text-dim);font-weight:400}

/* squad status */
.sq{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border:1px solid var(--border)}
.sq button{background:var(--surface);padding:10px 10px 9px;display:flex;flex-direction:column;gap:4px;min-width:0}
.sq button:hover{background:var(--surface-2)}
.sq .v{font:600 32px/1 var(--font-head);font-variant-numeric:tabular-nums}
.sq .l{font:500 12px/1.2 var(--font-body);color:var(--text-dim)}
.sq .bad .v{color:var(--danger)}.sq .warn .v{color:var(--warning)}.sq .zero .v{color:var(--text-faint)}

/* board & fans */
.meters{display:flex;flex-direction:column;gap:16px}
.meter{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:end}
.meter .lab{font:600 13px/1 var(--font-head);letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim)}
.meter .num{display:flex;align-items:center;gap:6px;font:600 26px/1 var(--font-head);font-variant-numeric:tabular-nums}
.trend{font:600 12px/1 var(--font-head);letter-spacing:.04em}
.trend.up{color:var(--win)}.trend.down{color:var(--loss)}.trend.flat{color:var(--text-faint)}
.bar{grid-column:1/-1;position:relative;height:6px;background:var(--surface-3);overflow:hidden}
.bar i{position:absolute;inset:0;transform-origin:0 50%;background:var(--win)}
.bar u{position:absolute;top:0;bottom:0;width:1px;background:var(--surface)}
.verdict{grid-column:1/-1;font-size:13px;color:var(--text-dim)}

/* telestrator marker strokes (on air): small SVGs drawn on with stroke-dashoffset */
.tele{display:block;width:100%;height:auto;overflow:visible}
.tele .ln{fill:none;stroke:var(--border);stroke-width:1}
.tele .mk-us,.tele .mk-them{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.tele .mk-us{stroke:var(--accent-text)}
.tele .mk-them{stroke:var(--text)}
.tele .mk-ok{fill:none;stroke:var(--win);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.tele text{font:600 11px/1 var(--font-head);letter-spacing:.08em;text-transform:uppercase}

    const a = document.activeElement;
    if (a && a !== document.body && a.matches('button,input,select,textarea,a,[tabindex]') && a.id !== 'go') return;
    e.preventDefault(); onContinue();
  } else if (/^[1-9]$/.test(e.key)) { go(PAGES[+e.key - 1].id); }
});
/* Continue idles: one small hop every 6 s after 10 s without input. It is the only thing that ever moves to get attention. */
let lastInput = performance.now();
['pointerdown', 'keydown', 'pointermove'].forEach(ev => addEventListener(ev, () => { lastInput = performance.now(); }, { passive: true }));
setInterval(() => {
  if (RM() || busy || $('.ovl') || performance.now() - lastInput < 10000) return;
  A($('#go'), [{ transform: 'none', easing: 'cubic-bezier(.3,0,.4,1)' }, { transform: 'translateY(-6px)', offset: .28, easing: 'cubic-bezier(.6,0,.8,.4)' }, { transform: 'none', offset: .56, easing: 'cubic-bezier(.3,0,.4,1)' }, { transform: 'translateY(-2px)', offset: .76 }, { transform: 'none' }], { duration: 620 });
}, 6000);
let rz; addEventListener('resize', () => { placeBlock(); clearTimeout(rz); rz = setTimeout(() => { printAll(); renderTicker(); if (S.page === 'hub') playCaptains(screen, false); }, 160); });

/* reference controls */
$('#swatches').innerHTML = Object.keys(CLUBS).map(id => `<button class="sw" data-id="${id}" style="--c:${CLUBS[id].th[0]};--ci:${CLUBS[id].th[1]}" aria-label="${CLUBS[id].name}" title="${CLUBS[id].name}">${CLUBS[id].code}</button>`).join('');
const rmBtn = $('#rm');
const syncRM = () => { rmBtn.setAttribute('aria-pressed', String(reduce)); document.documentElement.classList.toggle('reduce', reduce); };
rmBtn.addEventListener('click', () => { reduce = !reduce; syncRM(); renderTicker(); });
$('#replay').addEventListener('click', () => {
  if (busy) return;
  if (pageOf(S.page).world !== 'air') return settle();
  buildIn(); if (S.page === 'hub') { playCaptains(screen, true); drawOn($('#tipB', screen), 700); }
});

/* boot */
S = newState('c01');
applyTheme('c01'); syncRM(); renderTop(); renderNav(); setWorld(); renderScreen(); renderTicker();
requestAnimationFrame(() => { buildIn(); placeBlock(); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { placeBlock(); renderTicker(); });
window.addEventListener('load', () => { paintIcons(); placeBlock(); });
})();
</script>
