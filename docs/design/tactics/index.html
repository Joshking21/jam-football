<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Touchline Tactics Wall</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: the office. A warm desk under a lamp; a whiteboard (left, the dominant object) with magnets, a marker tray and the bench strip;
   a clipboard (right) that a player's file slides over. Game tokens are SPEC §19.2 verbatim; --ref-* style only the reference bar. */
:root{
  --bg:#07090D; --surface:#0E1218; --surface-2:#151A22; --surface-3:#1C222C; --border:#2A313D;
  --desk:#100E0C; --desk-2:#191613; --desk-border:#2E2924;
  --paper:#EFEBE3; --paper-2:#E4DED2; --paper-ink:#1B1A17; --paper-dim:#5E574E; --paper-rule:#CFC6B6;
  --board:#E9ECEA; --board-ink:#1E2A38; --marker-red:#C42B2B; --marker-blue:#1F4FBF; --marker-green:#1E7B3C;
  --text:#F2F4F7; --text-dim:#A3ACBA; --text-faint:#7D8696;
  --accent:#F2B705; --accent-ink:#0B1F3A; --accent-text:#F2B705; --band-1:#F2B705; --band-2:#0B1F3A;
  --win:#18C77A; --draw:#A3ACBA; --loss:#FF4D5E; --warning:#FFB020; --danger:#FF4D5E;
  --radius-s:2px; --radius-m:4px; --cut:10px;
  --shadow-paper:0 1px 0 rgb(0 0 0 / .25), 0 10px 24px rgb(0 0 0 / .5);
  --font-head:'Barlow Condensed','Arial Narrow',system-ui,sans-serif; --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --ease-snap:cubic-bezier(.2,.9,.1,1); --ease-out:cubic-bezier(.2,.8,.2,1);
  --manila:#D9C9A3; --alu-1:#CDD2D6; --alu-2:#9AA1A8;
  --fit-good:#1E7B3C; --fit-mid:#B7791F; --fit-bad:#C42B2B;
  --ref-bg:#040608; --ref-text:#8E97A6; --ref-border:#1F252E;
  --mag:44px;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ref-bg);color:var(--text);font:400 14px/1.45 var(--font-body);display:flex;flex-direction:column;gap:10px;
  padding-block:10px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
.lucide{width:18px;height:18px;stroke-width:1.75;flex:none}

/* reference bar */
.ref{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;color:var(--ref-text);font-size:12px}
.ref-t{font:600 13px/1 var(--font-head);letter-spacing:.1em;text-transform:uppercase;color:var(--text)}
.ref-g{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sw-row{display:flex;gap:3px;flex-wrap:wrap}
.sw{width:34px;height:22px;border-radius:2px;background:var(--c);color:var(--ci);font:700 11px/22px var(--font-head);letter-spacing:.04em;text-align:center;opacity:.5}
.sw:hover,.sw[aria-pressed="true"]{opacity:1}
.sw[aria-pressed="true"]{box-shadow:0 0 0 1px var(--ref-bg),0 0 0 2px var(--c)}
.ref-btn{border:1px solid var(--ref-border);border-radius:2px;padding:4px 10px;color:var(--text-dim)}
.ref-btn:hover,.ref-btn[aria-pressed="true"]{color:var(--text);border-color:var(--text-faint)}
.ref-hint{margin-left:auto}
.ref-hint kbd{font:500 11px/1 var(--font-body);border:1px solid var(--ref-border);border-radius:2px;padding:2px 5px;color:var(--text-dim)}

/* shell (office world) */
.app{flex:1;min-height:640px;display:grid;grid-template-columns:232px minmax(0,1fr);grid-template-rows:64px minmax(0,1fr);grid-template-areas:"top top" "nav stage";
  background:var(--bg);border:1px solid var(--border);position:relative;overflow:hidden;isolation:isolate}
.top{grid-area:top;display:flex;align-items:center;gap:16px;padding:0 12px 0 16px;background:var(--surface);border-bottom:1px solid var(--border);min-width:0;z-index:3}
.club{display:flex;align-items:center;gap:10px;width:216px;min-width:0;flex:none}
.club-name{font:700 20px/1 var(--font-head);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{flex:1;display:flex;justify-content:center;align-items:center;gap:12px;font:600 14px/1 var(--font-head);letter-spacing:.06em;text-transform:uppercase;color:var(--text-dim);white-space:nowrap;min-width:0}
.status b{color:var(--text);font-weight:600}
.status .sep{width:4px;height:4px;background:var(--text-faint);transform:rotate(45deg)}
.btn-go{position:relative;isolation:isolate;height:44px;padding:0 12px 0 18px;margin-left:auto;display:inline-flex;align-items:center;gap:12px;color:var(--accent-ink);
  font:700 19px/1 var(--font-head);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;flex:none}
.btn-go::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--accent);clip-path:polygon(0 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%)}
.btn-go:hover::before{background:color-mix(in srgb,var(--accent) 86%,#fff)}
.btn-go[aria-disabled="true"]{color:var(--text-faint);cursor:not-allowed}
.btn-go[aria-disabled="true"]::before{background:var(--surface-3)}
.key{font:600 11px/1 var(--font-body);letter-spacing:0;text-transform:none;padding:3px 5px;border:1px solid color-mix(in srgb,currentColor 40%,transparent);border-radius:2px}
.go-why{position:absolute;right:12px;top:58px;z-index:20;max-width:280px;padding:8px 10px;background:var(--surface-3);font-size:12px;color:var(--text);opacity:0;pointer-events:none;transition:opacity 180ms}
.btn-go[aria-disabled="true"]:hover + .go-why,.btn-go[aria-disabled="true"]:focus-visible + .go-why{opacity:1}

.nav{grid-area:nav;position:relative;background:var(--desk);border-right:1px solid var(--desk-border);padding:16px 8px;display:flex;flex-direction:column;gap:18px;overflow:hidden}
.grp{display:flex;flex-direction:column}
.grp-h{font:600 11px/1 var(--font-head);letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint);padding:0 12px 8px}
.it{display:flex;align-items:center;gap:12px;width:100%;height:36px;padding:0 12px;border-radius:var(--radius-s);color:var(--text-dim);font:500 14px/1 var(--font-body)}
.it:hover{color:var(--text);background:var(--desk-2)}
.it.on{height:64px;flex-direction:column;align-items:flex-start;justify-content:center;gap:5px;background:var(--accent);color:var(--accent-ink);
  clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%)}
.it.on .bn{display:flex;align-items:center;gap:10px;font:700 22px/1 var(--font-head);text-transform:uppercase;letter-spacing:.02em}
.it.on .bc{font:500 12px/1.2 var(--font-body);opacity:.8;padding-left:28px}
.stage{grid-area:stage;position:relative;overflow:auto;min-width:0;container-type:inline-size;
  background:radial-gradient(ellipse 60% 50% at 28% 0%,rgb(255 214 160 / .075),transparent 70%),var(--desk)}

/* ---------- the desk ---------- */
.desk{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,372px);gap:32px;padding:22px 32px 40px;align-items:start;min-height:100%}
@container (max-width:920px){ .desk{grid-template-columns:minmax(0,1fr);padding:18px 18px 32px} .prop{display:none} }
.wall{position:relative;z-index:1;min-width:0;display:flex;flex-direction:column}
.tabs{display:flex;gap:4px;padding-left:18px;position:relative;z-index:1}
.tab{height:34px;padding:0 16px;border-radius:4px 4px 0 0;background:var(--paper-2);color:var(--paper-dim);font:600 14px/34px var(--font-head);letter-spacing:.08em;text-transform:uppercase;
  transform:translateY(4px);transition:transform 180ms var(--ease-out)}
.tab:hover{transform:translateY(1px)}
.tab[aria-selected="true"]{background:var(--paper);color:var(--paper-ink);transform:none}
.tab .cnt{font:500 11px/1 var(--font-body);letter-spacing:0;text-transform:none;margin-left:6px;color:var(--paper-dim)}
.frame{position:relative;padding:10px;border-radius:5px;background:linear-gradient(160deg,var(--alu-1),var(--alu-2));box-shadow:var(--shadow-paper)}
.bd{position:relative;background:var(--board);border-radius:2px;aspect-ratio:1050/790;overflow:hidden;touch-action:none;
  background-image:radial-gradient(ellipse 40% 30% at 70% 30%,rgb(30 42 56 / .035),transparent 70%),radial-gradient(ellipse 30% 22% at 22% 72%,rgb(30 42 56 / .03),transparent 70%)}
.bd svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.pl{fill:none;stroke:var(--board-ink);stroke-opacity:.35;stroke-width:3;stroke-linecap:round}
.ghost{fill:none;stroke:var(--board-ink);stroke-opacity:.045;stroke-width:26;stroke-linecap:round}
.mk{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.mk.blue{stroke:var(--marker-blue)}.mk.red{stroke:var(--marker-red)}.mk.green{stroke:var(--marker-green)}.mk.ink{stroke:var(--board-ink)}
.mk.faint{stroke-opacity:.38}
.mk.dash{stroke-dasharray:14 12}
.bt{font:600 22px/1 var(--font-head);letter-spacing:.08em;text-transform:uppercase}
.bt.blue{fill:var(--marker-blue)}.bt.red{fill:var(--marker-red)}.bt.ink{fill:var(--board-ink);fill-opacity:.55}
.mvg{transition:transform 520ms var(--ease-out)}
.layer-opp{opacity:0;pointer-events:none;transition:opacity 220ms}
.wall.opp .layer-opp{opacity:1;pointer-events:auto}
.wall.opp .layer-us,.wall.opp .mag{opacity:0;pointer-events:none}
.layer-us,.mag{transition:opacity 220ms}
.opp-o{cursor:pointer}
.opp-o:focus{outline:none}
.opp-o:focus-visible .hit,.opp-o.sel .hit{stroke:var(--paper-ink);stroke-width:3;stroke-dasharray:6 6}
.hit{fill:transparent;stroke:none}

/* magnets */
.mag{position:absolute;left:0;top:0;width:var(--mag);display:flex;flex-direction:column;align-items:center;gap:3px;touch-action:none;z-index:2;will-change:transform}
.mag .disc{position:relative;width:var(--mag);height:var(--mag);border-radius:50%;background:var(--k1);border:2px solid var(--k2);color:var(--k2);display:grid;place-items:center;
  font:700 calc(var(--mag) * .4)/1 var(--font-head);box-shadow:0 1px 0 rgb(0 0 0 / .25),0 2px 4px rgb(0 0 0 / .25);transition:transform 140ms var(--ease-out)}
.mag .disc::after{content:"";position:absolute;inset:-2px;border-radius:50%;box-shadow:0 10px 18px rgb(0 0 0 / .35);opacity:0;transition:opacity 140ms}
.mag.lift{z-index:10}
.mag.lift .disc{transform:scale(1.08)}
.mag.lift .disc::after{opacity:1}
.mag .nm{font:600 13px/1 var(--font-head);letter-spacing:.02em;color:var(--board-ink);white-space:nowrap;max-width:84px;overflow:hidden;text-overflow:ellipsis;text-align:center}
.mag .ovr{position:absolute;right:-12px;top:-7px;min-width:24px;height:18px;padding:0 4px;border-radius:2px;background:var(--fit);color:#fff;font:700 12px/18px var(--font-head);text-align:center;font-variant-numeric:tabular-nums}
.mag.bench{--mag:36px}.mag.bench .nm{font-size:12px;max-width:60px}
.mag.hurt .disc{filter:saturate(.35)}
.mag.hurt .disc::before{content:"";position:absolute;inset:6px;background:linear-gradient(var(--marker-red),var(--marker-red)) center/70% 4px no-repeat,linear-gradient(var(--marker-red),var(--marker-red)) center/4px 70% no-repeat}
.mag .ring{position:absolute;left:50%;top:calc(var(--mag) / 2);width:calc(var(--mag) + 22px);height:calc(var(--mag) + 22px);transform:translate(-50%,-50%);pointer-events:none;overflow:visible}
.mag:focus{outline:none}
.mag:focus-visible .disc{outline:2px solid var(--paper-ink);outline-offset:4px}
.mag.armed .disc{outline:2px dashed var(--marker-blue);outline-offset:5px}

.tray{position:relative;height:34px;margin:0 30px;border-radius:0 0 6px 6px;background:linear-gradient(var(--alu-2),#80878E);box-shadow:0 6px 12px rgb(0 0 0 / .45)}
.tray svg{position:absolute;left:18px;top:6px;height:22px;width:auto}
.wall-foot{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:14px 4px 0;color:var(--text-dim);font-size:12px}
.wall-foot b{font:600 12px/1 var(--font-head);letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint)}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:5px}

/* paper */
.side{position:relative;z-index:1;min-width:0}
.sheet{position:relative;background:var(--paper);color:var(--paper-ink);border-radius:3px;box-shadow:var(--shadow-paper);padding:24px 22px 22px}
.sheet :focus-visible{outline-color:var(--paper-ink)}
.clip{padding-top:40px}
.clip::before{content:"";position:absolute;left:50%;top:-12px;width:132px;height:34px;transform:translateX(-50%);border-radius:5px 5px 8px 8px;
  background:linear-gradient(#3A3F45,#24282D);box-shadow:0 2px 0 rgb(0 0 0 / .3),inset 0 1px 0 rgb(255 255 255 / .12)}
.clip::after{content:"";position:absolute;left:50%;top:-2px;width:64px;height:8px;transform:translateX(-50%);border-radius:4px;background:#15181B}
.s-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-bottom:8px;border-bottom:2px solid var(--paper-ink);
  font:600 12px/1 var(--font-head);letter-spacing:.1em;text-transform:uppercase;color:var(--paper-dim)}
.s-title{margin:12px 0 2px;font:700 30px/1 var(--font-head);text-transform:uppercase;letter-spacing:.02em}
.form-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--paper-rule)}
.sel-wrap{position:relative}
.sel-wrap select{appearance:none;-webkit-appearance:none;width:100%;height:38px;padding:0 34px 0 10px;background:var(--paper-2);border:1px solid var(--paper-rule);border-radius:3px;color:var(--paper-ink);
  font:700 20px/1 var(--font-head);letter-spacing:.04em;cursor:pointer}
.sel-wrap::after{content:"";position:absolute;right:12px;top:50%;width:8px;height:8px;border-right:2px solid var(--paper-ink);border-bottom:2px solid var(--paper-ink);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.sel-wrap.sm select{height:30px;font:500 13px/1 var(--font-body);letter-spacing:0;padding-right:28px}
.fam{display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:96px}
.fam .v{font:600 24px/1 var(--font-head);font-variant-numeric:tabular-nums}
.fam .l{font:500 11px/1 var(--font-body);color:var(--paper-dim)}
.fam .bar{width:96px;height:5px;background:var(--paper-rule);position:relative;overflow:hidden}
.fam .bar i{position:absolute;inset:0;transform-origin:0 50%;background:var(--paper-ink);transition:transform 400ms var(--ease-out)}
.presets{display:flex;flex-wrap:wrap;gap:6px;padding:12px 0 4px}
.chip{height:28px;padding:0 10px;border:1px solid var(--paper-rule);border-radius:14px;font:500 12px/26px var(--font-body);color:var(--paper-ink);background:transparent}
.chip:hover{background:var(--paper-2)}
.chip:active{transform:translateY(1px)}
.dividers{display:flex;gap:2px;margin:14px -22px 0;padding:0 14px;border-bottom:2px solid var(--paper-ink)}
.dv{flex:1;height:30px;border-radius:3px 3px 0 0;background:var(--paper-2);color:var(--paper-dim);font:600 12px/30px var(--font-head);letter-spacing:.06em;text-transform:uppercase;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.dv[aria-selected="true"]{background:var(--paper-ink);color:var(--paper)}
.grpw{padding-top:4px;min-height:268px}
.ins{padding:11px 0 10px;border-bottom:1px solid var(--paper-rule)}
.ins-l{font:600 12px/1 var(--font-head);letter-spacing:.1em;text-transform:uppercase;color:var(--paper-dim);margin-bottom:8px}
.seg{display:flex;flex-wrap:wrap;gap:2px 4px}
.opt{position:relative;padding:5px 9px;font:500 14px/1.2 var(--font-body);color:var(--paper-dim);border-radius:3px}
.opt:hover{color:var(--paper-ink);background:var(--paper-2)}
.opt[aria-checked="true"]{color:var(--paper-ink);font-weight:600}
.opt .ring{position:absolute;inset:-5px -8px;width:calc(100% + 16px);height:calc(100% + 10px);pointer-events:none;overflow:visible}
.ring path{fill:none;stroke:var(--marker-blue);stroke-width:2.6;stroke-linecap:round}
.ins-d{margin:8px 0 0;font-size:13px;line-height:1.45;color:var(--paper-dim);min-height:19px}
.takers{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;align-items:center;padding:12px 0 4px;font-size:13px}
.takers label{color:var(--paper-dim)}
.ready{display:flex;align-items:flex-start;gap:8px;margin-top:14px;padding-top:12px;border-top:2px solid var(--paper-ink);font:600 15px/1.3 var(--font-head);letter-spacing:.04em;text-transform:uppercase}
.ready.ok{color:var(--marker-green)}.ready.bad{color:var(--marker-red)}
.ready svg{flex:none;width:22px;height:22px;overflow:visible}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.pbtn{height:34px;padding:0 12px;display:inline-flex;align-items:center;gap:8px;border-radius:3px;font:500 13px/1 var(--font-body)}
.pbtn.solid{background:var(--paper-ink);color:var(--paper)}
.pbtn.solid:hover{background:#34322D}
.pbtn.line{border:1px solid var(--paper-ink);color:var(--paper-ink)}
.pbtn.line:hover{background:var(--paper-2)}
.pbtn:active{transform:translateY(2px)}
.pbtn .lucide{width:16px;height:16px}

/* the player's file (slides over the clipboard) */
.file{position:absolute;left:-10px;right:10px;top:26px;z-index:5;padding-top:30px}
.file .tabm{position:absolute;left:18px;top:-26px;height:28px;padding:0 14px;border-radius:4px 4px 0 0;background:var(--manila);font:700 15px/28px var(--font-head);letter-spacing:.04em;text-transform:uppercase;color:var(--paper-ink)}
.file .x{position:absolute;right:10px;top:10px;width:32px;height:32px;display:grid;place-items:center;border-radius:3px;color:var(--paper-dim)}
.file .x:hover{background:var(--paper-2);color:var(--paper-ink)}
.who{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding-bottom:12px;border-bottom:2px solid var(--paper-ink)}
.who .disc{width:46px;height:46px;border-radius:50%;background:var(--k1);border:2px solid var(--k2);color:var(--k2);display:grid;place-items:center;font:700 19px/1 var(--font-head);grid-row:1/3}
.who h2{margin:0;font:700 26px/1 var(--font-head);text-transform:uppercase;letter-spacing:.02em}
.who .meta{font-size:12px;color:var(--paper-dim)}
.who .o{grid-row:1/3;text-align:right;font:600 30px/1 var(--font-head);font-variant-numeric:tabular-nums}
.who .o small{display:block;font:500 11px/1.3 var(--font-body);color:var(--paper-dim)}
.sub-h{margin:14px 0 4px;font:600 12px/1 var(--font-head);letter-spacing:.1em;text-transform:uppercase;color:var(--paper-dim);display:flex;justify-content:space-between}
.roles{display:flex;flex-direction:column}
.role{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:9px 8px 9px 12px;border-bottom:1px solid var(--paper-rule);border-radius:2px}
.role:hover{background:var(--paper-2)}
.role .rn{font:600 15px/1.2 var(--font-body)}
.role .st{font-size:13px;letter-spacing:1px;color:var(--paper-ink);white-space:nowrap}
.role .st i{font-style:normal;color:var(--paper-rule)}
.role .st.any{font:500 11px/1 var(--font-body);letter-spacing:0;color:var(--paper-dim)}
.role .rd{grid-column:1/-1;font-size:13px;color:var(--paper-dim)}
.role .gc{grid-column:1/-1;display:none;font-size:12.5px;line-height:1.45}
.role[aria-checked="true"] .gc{display:block}
.role[aria-checked="true"]::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:4px;border-radius:2px;background:var(--marker-blue)}
.g{color:var(--marker-green)}.c{color:var(--marker-red)}
.pis{display:flex;flex-direction:column}
.pi{display:grid;grid-template-columns:22px minmax(0,1fr);gap:2px 10px;padding:8px 4px;border-bottom:1px solid var(--paper-rule);align-items:start}
.pi .box{width:18px;height:18px;border:2px solid var(--paper-ink);border-radius:2px;margin-top:1px;position:relative}
.pi .box svg{position:absolute;inset:-6px;width:30px;height:30px;overflow:visible}
.pi .t{font-size:13.5px;line-height:1.35}
.pi .why{grid-column:2;font-size:12px;color:var(--paper-dim)}
.pi[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.pi:not([aria-disabled="true"]):hover{background:var(--paper-2)}
.order{display:flex;flex-direction:column;gap:3px;padding:10px 8px;border-bottom:1px solid var(--paper-rule);text-align:left;width:100%;border-radius:2px}
.order:hover{background:var(--paper-2)}
.order .on{font:600 14px/1.2 var(--font-body)}

function settle(root) {
  $$('.sheet', root).forEach((s, i) => {
    const rest = +s.dataset.rot; if (RM()) return;
    const extra = s.classList.contains('file') ? 1.4 : -1.2, dx = s.classList.contains('file') ? 40 : 0;
    let x = 1, v = 0, lastT = performance.now();
    const step = t => { const dt = Math.min(.032, (t - lastT) / 1000); lastT = t; for (let k = 0; k < 4; k++) { const h = dt / 4; v += (-420 * x - 34 * v) * h; x += v * h; }
      s.style.transform = `translate(${(dx * x).toFixed(1)}px,${(10 * x).toFixed(1)}px) rotate(${(rest + extra * x).toFixed(2)}deg)`;
      if (Math.abs(x) > .002 || Math.abs(v) > .02) requestAnimationFrame(step); else s.style.transform = `rotate(${rest}deg)`; };
    s.style.transform = `translate(${dx}px,10px) rotate(${rest + extra}deg)`;
    setTimeout(() => requestAnimationFrame(t => { lastT = t; step(t); }), i * 50);
  });
}

function bestXI() {
  const avail = SQUAD.filter(p => !p.injured).map(p => p.i), used = new Set(), xi = Array(11);
  const ordr = ['GK', 'CB', 'LB', 'RB', 'LWB', 'RWB', 'DM', 'CM', 'AM', 'LM', 'RM', 'LW', 'RW', 'ST'];
  const idx = slots().map((s, i) => i).sort((a, b) => ordr.indexOf(slots()[a][0]) - ordr.indexOf(slots()[b][0]));
  for (const i of idx) {
    const pos = slots()[i][0]; let best = null, bs = -1;
    for (const pi of avail) { if (used.has(pi)) continue; const p = SQUAD[pi], sc = p.ovr * famOf(p, pos) * (.7 + .3 * p.cond / 100); if (sc > bs) { bs = sc; best = pi; } }
    xi[i] = best; used.add(best);
  }
  const rest = avail.filter(pi => !used.has(pi)).sort((a, b) => SQUAD[b].ovr - SQUAD[a].ovr);
  const gk = rest.find(pi => SQUAD[pi].pos.includes('GK')), bench = [gk, ...rest.filter(pi => pi !== gk)].filter(v => v !== undefined).slice(0, 8);
  const left = rest.filter(pi => !bench.includes(pi));
  T.xi = xi; T.bench = bench; T.treat = [19, ...left].slice(0, 1);
  if (left.length) T.bench = T.bench.concat(left).slice(0, 9);
  refreshMagnets(false, true); drawUs(false); updateReady(); toast('Theo picked the XI on form and fitness.');
  if (T.sel !== null) { const pi = T.sel; T.sel = null; selectPlayer(pi); }
}
